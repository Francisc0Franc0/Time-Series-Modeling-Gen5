# Example Gen5 data-layer configuration.
# Copy to config/data_layer.local.yml for local paths and symbols.
# Keep Alpaca credentials in environment variables or ignored .Renviron, not YAML.

provider: alpaca
timeframe: 1D
adjusted: true
feed: iex
signal_timing: after_close_for_next_open

cache:
  # Default v0.1 working cache. This folder is repo-local and gitignored.
  # Operators may override with GEN5_CACHE_ROOT or config/data_layer.local.yml.
  root: data_cache/alpaca_daily_adjusted
  format: rds

calendar:
  timezone: America/New_York
  market_close_time: "16:00:00"
  incomplete_bar_policy: exclude_current_unclosed_session

symbols:
  - SPY
  - QQQ
  - TSLA
  - NVDA
